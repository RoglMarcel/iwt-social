# Daily news brief carousel. Builds the slides and queues them for the 08:00 New York news slot.
# Started by the Supabase timer (iwt-social function, newsDispatchPass) between 05:30 and 09:30
# New York, not by a GitHub schedule: GitHub started scheduled runs hours late or not at all
# (22 Nov 2026: none; 23 Nov 2026: one run at 22:11 UTC, after the 11:00 New York cut-off).
# The script exits when today's brief already exists.
name: News brief

on:
  workflow_dispatch:

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: news-brief
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node news-brief.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          IWT_SECRET: ${{ secrets.IWT_SECRET }}
