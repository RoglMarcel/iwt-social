# Daily news brief carousel. Builds the slides and queues them for the 08:00 New York news slot.
# GitHub can skip scheduled runs under load (22 Nov 2026: the only 10:30 UTC run never started),
# so the job is scheduled four times. The script exits when today's brief already exists.
# 10:30-13:30 UTC is 05:30-08:30 New York in winter, 06:30-09:30 in summer; the brief can be
# posted until 11:00 New York.
name: News brief

on:
  schedule:
    - cron: "30 10,11,12,13 * * *"
  workflow_dispatch:

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: news-brief
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node news-brief.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          IWT_SECRET: ${{ secrets.IWT_SECRET }}
